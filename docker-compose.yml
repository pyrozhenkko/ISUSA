version: '3.8'

services:
  # ---------------------------
  # 1. Основна БД
  # ---------------------------
  db:
    image: postgres:14-alpine
    container_name: isusa_db
    environment:
      POSTGRES_DB: isusa_main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"  # локальний доступ
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
      start_period: 10s

  # ---------------------------
  # 2. БД для звітів
  # ---------------------------
  db_reports:
    image: postgres:14-alpine
    container_name: isusa_db_reports
    environment:
      POSTGRES_DB: isusa_reports
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"  # локальний доступ
    volumes:
      - pgdata_reports:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
      start_period: 10s

  # ---------------------------
  # 3. Spring Boot додаток
  # ---------------------------
  app:
    build: ./app
    container_name: isusa_app
    ports:
      - "8081:8081"
    environment:
      # Основна БД
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/isusa_main
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Друга БД (для звітів)
      SPRING_REPORTS_DATASOURCE_URL: jdbc:postgresql://db_reports:5432/isusa_reports
      SPRING_REPORTS_DATASOURCE_USERNAME: postgres
      SPRING_REPORTS_DATASOURCE_PASSWORD: postgres
      # Інші налаштування
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8081
    depends_on:
      db:
        condition: service_healthy
      db_reports:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------
  # 4. Frontend (React)
  # ---------------------------
  frontend:
    build: ./frontend/frontend
    container_name: isusa_frontend
    ports:
      - "5173:5173"
    working_dir: /app
    command: ["npm", "run", "dev"]
    depends_on:
      - app

# ---------------------------
# Volumes для збереження даних
# ---------------------------
volumes:
  pgdata:
  pgdata_reports:
